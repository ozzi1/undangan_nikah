<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Undangan Pernikahan</title>
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Jost:wght@300;400;500;600&family=Amiri:wght@400;700&display=swap" rel="stylesheet">

<style>
/* ===================== TEMA (ubah warna di sini) ===================== */
:root{
  --teal:#12303a; --mist:#e9eff0; --brass:#b58a4a; --dust:#c98f8f; --ink:#0d1f25;
  --serif:'Cormorant Garamond', Georgia, serif;
  --sans:'Jost', system-ui, sans-serif;
  --nav-h:72px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);color:var(--ink);background:#0a1a20;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}

.phone{position:relative;max-width:430px;margin:0 auto;background:#0a1a20;height:100dvh;overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,.5)}
section{padding:72px 28px;text-align:center;position:relative}
h1,h2,h3{font-family:var(--serif);font-weight:400;line-height:1.1}
h2{font-size:2.3rem;margin-bottom:18px;color:var(--brass)}
p{line-height:1.7;font-weight:300;font-size:.98rem}
.small{font-size:.85rem;letter-spacing:.04em}

.basmalah{font-family:'Amiri','Traditional Arabic',serif;font-size:2.1rem;line-height:1.9;direction:rtl}

/* ===================== COVER ===================== */
.cover{position:fixed;inset:0;z-index:100;display:flex;justify-content:center}
.cover .inner{width:100%;max-width:430px;position:relative;height:100dvh;overflow:hidden;container-type:inline-size}
/* Dua pintu = satu gambar utuh yang dibelah dua. Lebar gambar = lebar sampul (100cqw),
   pintu sedikit tumpang tindih (+1px) agar tidak ada celah/garis di tengah. */
.door{position:absolute;top:0;bottom:0;width:calc(50% + .5px);background:var(--teal);overflow:hidden;transition:transform 1.4s cubic-bezier(.77,0,.18,1);z-index:1}
.door.l{left:0}
.door.r{right:0}
.door .art{position:absolute;top:0;height:100%;width:100cqw;max-width:none;display:block}
/* Foto pintu dari Sheet ("pintu kiri" / "pintu kanan"); gambar bawaan dipakai bila kosong/gagal dimuat */
.door .dphoto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.door.photo::after{content:"";position:absolute;inset:0;background:rgba(8,20,25,.38)}
.door.l .art{left:0}
.door.r .art{right:0}
.cover-content{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;color:var(--mist);padding:9dvh 30px 8dvh;text-shadow:0 1px 6px rgba(0,0,0,.6);transition:opacity .6s ease, transform .8s ease}
.cover-content .to{font-family:var(--serif);font-size:1.7rem;color:var(--brass);margin:6px 0 16px}
.cover-content h1{font-size:3rem;margin:10px 0 0}
.btn{font-family:var(--sans);background:transparent;color:var(--mist);border:1px solid var(--brass);padding:13px 30px;border-radius:40px;font-size:.92rem;letter-spacing:.06em;cursor:pointer;transition:background .3s,color .3s}
.btn:hover:not(:disabled),.btn:focus-visible{background:var(--brass);color:var(--ink);outline:none}
.btn:disabled{opacity:.55;cursor:wait}
.cover.open .door.l{transform:translateX(-101%)}
.cover.open .door.r{transform:translateX(101%)}
.cover.open .cover-content{opacity:0;transform:scale(1.15);pointer-events:none}
.cover.gone{display:none}
#coverMsg{min-height:1.4em;font-size:.85rem;margin-bottom:14px;color:var(--dust)}

.music{position:fixed;bottom:calc(var(--nav-h) + 14px + env(safe-area-inset-bottom));right:calc(50% - 215px + 16px);z-index:60;width:44px;height:44px;border-radius:50%;border:1px solid var(--brass);background:rgba(18,48,58,.8);color:var(--brass);font-size:1.1rem;cursor:pointer;backdrop-filter:blur(6px)}
@media (max-width:430px){.music{right:16px}}
.music.playing{animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===================== MENU BAWAH (gaya menu game) ===================== */
.menu{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;z-index:55;display:flex;
  height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  background:linear-gradient(to top,rgba(8,20,25,.98),rgba(18,48,58,.94));border-top:1px solid var(--brass);backdrop-filter:blur(8px)}
.menu[hidden]{display:none}
.menu button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:none;border:0;color:rgba(233,239,240,.6);
  font-family:var(--sans);font-size:.64rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;position:relative;transition:color .25s}
.menu #closeBtn{color:var(--dust);border-left:1px solid rgba(181,138,74,.35)}
.menu button i{font-style:normal;font-size:1.25rem;line-height:1}
.menu button::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:2px;background:var(--brass);transform:scaleX(0);transition:transform .3s}
.menu button.on{color:var(--brass);text-shadow:0 0 12px rgba(181,138,74,.55)}
.menu button.on::before{transform:scaleX(1)}
.menu button.on span::before{content:"▸ ";}
.menu button:focus-visible{outline:1px solid var(--brass);outline-offset:-4px}

/* ===================== PANEL ===================== */
.panel{position:absolute;inset:0;z-index:1;color:var(--mist);display:none;overflow-y:auto;overflow-x:hidden;padding-bottom:calc(var(--nav-h) + 24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.panel.active{display:block;animation:pin .55s ease}
@keyframes pin{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.panel.dark{background:transparent}

/* HOME */
.panel#p-home.active{display:flex;flex-direction:column;justify-content:flex-end;color:var(--mist);overflow:hidden;padding-bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom))}
#slides{position:absolute;inset:0;z-index:0;background:#0a1a20}
#slides img{width:100%;height:100%;object-fit:cover;display:block}
/* Slideshow Home: pudar silang + zoom perlahan (Ken Burns) */
.slide{position:absolute;inset:0;opacity:0;z-index:0;overflow:hidden;transition:opacity 1.2s ease}
.slide.on{opacity:1;z-index:1}
.slide.on img,.slide.prev img{animation:kb 8s ease-out forwards}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.14)}}
/* Lapisan gelap di atas foto: tipis di Home (foto jelas), lebih pekat di halaman lain (teks terbaca) */
#slides::after{content:"";position:absolute;inset:0;z-index:2;background:linear-gradient(to top,rgba(8,20,25,.92) 8%,rgba(8,20,25,.15) 55%,rgba(8,20,25,.35));transition:background .6s ease}
#app:not([data-panel="home"]) #slides::after{background:rgba(8,20,25,.8)}
.home-in{text-shadow:0 1px 10px rgba(0,0,0,.65)}
.home-in{position:relative;z-index:1;text-align:center;padding:64px 22px 0}
.home-in h1{font-size:3rem;margin:6px 0 18px}
.amp{font-style:italic;color:var(--brass)}
.duo{display:flex;align-items:center;gap:8px;justify-content:center}
.char{flex:1;margin:0}
.char .frame{width:100%;margin:0 0 10px;aspect-ratio:3/4.1;border:1px solid var(--brass);box-shadow:0 0 24px rgba(181,138,74,.25)}
.char figcaption{font-family:var(--serif);font-size:1.35rem;color:var(--mist)}
.char figcaption small{display:block;font-family:var(--sans);font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--brass);margin-bottom:2px}
.vs{font-family:var(--serif);font-style:italic;font-size:2.2rem;color:var(--brass)}
.home-date{margin-top:18px;letter-spacing:.08em}
.press{margin-top:14px;font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;color:var(--brass);animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}

.frame{position:relative;overflow:hidden;border-radius:200px 200px 12px 12px;margin:0 auto 22px;width:78%;aspect-ratio:3/4;background:#2c5560}
.frame.square{border-radius:12px;width:100%;aspect-ratio:4/5;margin:0}
.frame img{width:100%;height:100%;object-fit:cover;display:block;will-change:transform}

/* ===================== ANIMASI SCROLL ===================== */
[data-anim]{opacity:0;transition:opacity 1s ease, transform 1.1s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
[data-anim="fade-up"]{transform:translateY(40px)}
[data-anim="slide-left"]{transform:translateX(-60px)}
[data-anim="slide-right"]{transform:translateX(60px)}
[data-anim="zoom-in"]{transform:scale(.7)}
[data-anim="zoom-out"]{transform:scale(1.35)}
[data-anim].show{opacity:1;transform:none}

/* ===================== KONTEN ===================== */
.dark{background:rgba(18,48,58,.5);color:var(--mist)}
.dark h2{color:var(--brass)}
.names{font-size:1.9rem;color:var(--mist);margin:6px 0 4px}
.parents{font-size:.88rem;opacity:.8}
.divider{width:1px;height:50px;background:var(--brass);margin:26px auto}

.countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:26px}
.countdown div{border:1px solid rgba(181,138,74,.6);border-radius:10px;padding:14px 4px}
.countdown b{display:block;font-family:var(--serif);font-size:2rem;font-weight:400;color:var(--brass)}
.countdown span{font-size:.72rem;opacity:.85}

.card{border:1px solid rgba(181,138,74,.7);border-radius:14px;padding:26px 20px;margin-top:22px;background:rgba(18,48,58,.55)}
.card h3{font-size:1.6rem;color:var(--brass);margin-bottom:8px}
.link{display:inline-block;margin-top:16px;text-decoration:none;font-size:.85rem;border:1px solid var(--brass);color:var(--brass);padding:10px 22px;border-radius:30px;cursor:pointer;background:transparent;font-family:var(--sans)}
.link:hover{background:var(--brass);color:var(--ink)}

.gallery{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:24px}
.gallery .frame.wide{grid-column:span 2;aspect-ratio:16/10}

/* MAPS & FORM */
.page-pad{padding:72px 22px 10px;text-align:center}
.mapbox,.formbox{margin-top:18px;border-radius:14px;overflow:hidden;background:#fff;border:1px solid rgba(181,138,74,.7)}
.mapbox iframe{display:block;width:100%;height:min(52dvh,420px);border:0}
.formbox iframe{display:block;width:100%;height:940px;border:0}
.addr{margin-top:20px}
.empty{margin-top:24px;opacity:.8}

@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important;animation:none!important}
  [data-anim]{opacity:1;transform:none}
}
</style>
</head>

<body class="locked">

<!-- ===================== COVER ===================== -->
<div class="cover" id="cover">
  <div class="inner">
    <div class="door l"></div>
    <div class="door r"></div>
    <div class="cover-content">
      <div>
        <p class="small">THE WEDDING OF</p>
        <h1 id="coverNames">&nbsp;</h1>
      </div>
      <div>
        <p class="small">Kepada Yth. Bapak/Ibu/Saudara/i</p>
        <p class="to" id="guestName">Tamu Undangan</p>
        <p id="coverMsg" role="status"></p>
        <button class="btn" id="openBtn" disabled>Memuat…</button>
      </div>
    </div>
  </div>
</div>

<button class="music" id="musicBtn" hidden aria-label="Putar atau jeda musik">♪</button>
<audio id="bgm" loop preload="none"></audio>

<main class="phone" id="app"></main>

<nav class="menu" id="menu" hidden aria-label="Menu utama">
  <button data-go="home" class="on"><i>⌂</i><span>Home</span></button>
  <button data-go="isi"><i>✉</i><span>Isi</span></button>
  <button data-go="maps"><i>⚑</i><span>Maps</span></button>
  <button data-go="rsvp"><i>✔</i><span>Hadir</span></button>
  <button id="closeBtn" aria-label="Tutup undangan"><i>✕</i><span>Tutup</span></button>
</nav>

<script>
/* ============================================================
 *  PENGATURAN
 *  SHEET_ID   : ID Google Sheet "Main data" (dibagikan "Anyone with the link" -> Viewer).
 *               Kosong = memakai DATA CONTOH (pratinjau).
 *  FORM_EMBED : link Google Form berakhiran ?embedded=true (dipasang sebagai iframe).
 * ============================================================ */
const CFG = {
  SHEET_ID: '1mlQuMGj7E0pxA05UiB6kdYu6JpViPhZTZVmtA_xDQ4E',
  FORM_EMBED: 'https://docs.google.com/forms/d/e/1FAIpQLSe8KD3lZavdS15ANV28F3Gzf40vvwGsJDZEAcCzYHn97ZQzVw/viewform?embedded=true'
};

/* Data contoh untuk pratinjau tanpa Google Sheet */
const DEMO = {
  main: {
    nama_pria:'Raka Pratama', bapak_pria:'Hadi', ibu_pria:'Wati',
    nama_wanita:'Sinta Ayu Lestari', bapak_wanita:'Agus', ibu_wanita:'Rina',
    alamat:'Gedung Serbaguna Kartika, Jl. Merdeka No. 10, Malang',
    link_alamat:'https://maps.google.com/?q=Malang',
    tanggal:'12 Desember 2026', jam:'09.00 WIB'
  },
  // no 1 = sampul/latar, 2 = pria, 3 = wanita, 4 dst = galeri
  foto:[{no:4,link:'demo-1'},{no:5,link:'demo-2'},{no:6,link:'demo-3'}]
};

/* ===================== ALAT BANTU ===================== */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const driveId = u => { const m = String(u || '').match(/(?:\/d\/|[?&]id=)([\w-]{20,})/); return m ? m[1] : null; };
const imgUrl = u => { if (!u) return ''; const id = driveId(u); return id ? `https://lh3.googleusercontent.com/d/${id}=w1200` : u; };
const audioUrl = u => { const id = driveId(u); return id ? `https://drive.google.com/uc?export=download&id=${id}` : (u || ''); };

const PH = 'data:image/svg+xml;utf8,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2c5560"/><stop offset="1" stop-color="#b58a4a"/></linearGradient></defs><rect width="600" height="800" fill="url(#g)"/></svg>');

function photo(url, alt, scrub, lazy = true, cls = '') {
  const id = driveId(url) || '';
  const src = url ? imgUrl(url) : PH;
  return `<img${cls ? ` class="${cls}"` : ''} src="${esc(src)}" data-id="${esc(id)}" alt="${esc(alt)}" referrerpolicy="no-referrer"` +
         `${scrub ? ` data-scrub="${scrub}"` : ''}${lazy ? ' loading="lazy"' : ''}>`;
}

document.addEventListener('error', e => {
  const img = e.target;
  if (img.tagName !== 'IMG' || img.dataset.ph) return;
  if (img.dataset.id && !img.dataset.retry) {
    img.dataset.retry = '1';
    img.src = `https://drive.google.com/thumbnail?id=${img.dataset.id}&sz=w1200`;
  } else { img.dataset.ph = '1'; img.src = PH; }
}, true);

/* ===== TANGGAL ===== */
const BULAN = ['januari','februari','maret','april','mei','juni','juli','agustus','september','oktober','november','desember'];
const HARI  = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

function parseTanggal(s, jam) {
  s = String(s || '').trim();
  if (!s) return null;
  let y, mo, d, m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) { y = +m[1]; mo = +m[2] - 1; d = +m[3]; }
  else {
    m = s.match(/(\d{1,2})\s+([A-Za-z]+)\.?\s+(\d{4})/);
    if (!m) return null;
    const nm = m[2].toLowerCase();
    mo = BULAN.indexOf(nm);
    if (mo < 0) mo = BULAN.findIndex(b => b.startsWith(nm.slice(0, 3)));
    if (mo < 0) return null;
    d = +m[1]; y = +m[3];
  }
  const t = String(jam || '').match(/(\d{1,2})[.:](\d{2})/);
  const hh = t ? +t[1] : 0, mm = t ? +t[2] : 0;
  const hari = HARI[new Date(Date.UTC(y, mo, d)).getUTCDay()];
  return {
    date: new Date(Date.UTC(y, mo, d, hh - 7, mm)),
    label: `${hari}, ${d} ${cap(BULAN[mo])} ${y}`
  };
}
const title = s => String(s || '').trim().replace(/(^|[\s'-])(\p{L})/gu, (_, a, b) => a + b.toUpperCase());

/* ===================== PETA (embed Google Maps tanpa API key) ===================== */
// Prioritas: koordinat (@lat,lng) di link -> parameter q= di link -> teks lokasi + alamat dari Sheet.
// Catatan: link pendek (maps.app.goo.gl) tidak bisa dibaca, jadi dipakai teks alamat.
function mapSrc(m) {
  const l = String(m.link_alamat || '');
  let q = '', a = l.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
  if (a) q = a[1] + ',' + a[2];
  else {
    a = l.match(/[?&](?:q|query)=([^&]+)/);
    if (a) { try { q = decodeURIComponent(a[1].replace(/\+/g, ' ')); } catch (e) {} }
  }
  if (!q) q = [m.lokasi, m.alamat].filter(Boolean).join(', ');
  return q ? `https://www.google.com/maps?q=${encodeURIComponent(q)}&output=embed` : '';
}

/* ===================== BACA GOOGLE SHEET LANGSUNG ===================== */
function loadSheet(id) {
  return new Promise((resolve, reject) => {
    const cb = 'gviz_' + Math.random().toString(36).slice(2);
    const s = document.createElement('script');
    let timer;
    const done = () => { clearTimeout(timer); delete window[cb]; s.remove(); };
    timer = setTimeout(() => {
      done();
      reject(new Error('Sheet tidak merespons. Pastikan dibagikan sebagai "Anyone with the link" (Viewer).'));
    }, 12000);
    window[cb] = res => {
      done();
      if (res && res.status === 'ok') resolve(res.table);
      else reject(new Error('Google menolak permintaan: ' + JSON.stringify(res && res.errors)));
    };
    s.onerror = () => { done(); reject(new Error('Gagal memuat Sheet (koneksi).')); };
    s.src = `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:json;responseHandler:${cb}&headers=0`;
    document.head.appendChild(s);
  });
}

const tableToRows = t => (t.rows || []).map(r => (r.c || []).map(c => c ? (c.f != null ? c.f : (c.v != null ? c.v : '')) : ''));

function parseMain(rows) {
  const main = {}, foto = [];
  let inFoto = false, urut = 0;
  rows.forEach(r => {
    const a = String(r[0] ?? '').trim(), b = String(r[1] ?? '').trim();
    const key = a.toLowerCase().replace(/\s+/g, ' ');
    if (!inFoto) {
      if (key === 'foto') { inFoto = true; return; }
      if (key && b) main[key.replace(/ /g, '_')] = b;
    } else {
      if (key === 'no') return;
      urut++;
      if (b) foto.push({ no: Number(a) > 0 ? Number(a) : urut, link: b });
    }
  });
  foto.sort((x, y) => x.no - y.no);
  return { main, foto };
}

/* ===================== FOTO PINTU DARI SHEET ===================== */
// Gambar bawaan (motif kawung) tetap tampil sampai foto berhasil dimuat; jika gagal, tetap memakai bawaan.
function setDoor(sel, url) {
  const door = document.querySelector(sel);
  if (!door || !url) return;
  const id = driveId(url);
  const tries = [imgUrl(url)];
  if (id) tries.push(`https://drive.google.com/thumbnail?id=${id}&sz=w1200`);
  const attempt = () => {
    const src = tries.shift();
    if (!src) return;
    const im = new Image();
    im.className = 'dphoto';
    im.alt = '';
    im.referrerPolicy = 'no-referrer';
    im.onload = () => { door.innerHTML = ''; door.appendChild(im); door.classList.add('photo'); };
    im.onerror = attempt;
    im.src = src;
  };
  attempt();
}

/* ===================== RENDER HALAMAN ===================== */
function render(data, to) {
  const m = data.main || {};
  const fotos = data.foto || [];
  const foto = n => (fotos.find(f => f.no === n) || {}).link || '';
  const galeriFoto = fotos.filter(f => f.no >= 4 && f.link);

  const namaPria = title(m.nama_pria), namaWanita = title(m.nama_wanita);
  const pgPria = title(m.panggilan_pria) || namaPria.split(' ')[0] || '';
  const pgWanita = title(m.panggilan_wanita) || namaWanita.split(' ')[0] || '';
  const ortu = (bapak, ibu, jenis) => {
    const p = [];
    if (bapak) p.push('Bapak ' + title(bapak));
    if (ibu) p.push('Ibu ' + title(ibu));
    return p.length ? `${jenis} dari ${p.join(' & ')}` : '';
  };

  const tgl = parseTanggal(m.tanggal, m.jam);
  const tanggalTampil = tgl ? tgl.label : (m.tanggal || '');
  const showCountdown = !!(tgl && tgl.date > new Date());
  const pembuka = m.teks_pembuka || 'Dengan memohon rahmat Tuhan Yang Maha Esa, kami mengundang Bapak/Ibu/Saudara/i untuk hadir dan memberi doa restu di hari pernikahan kami.';
  const penutup = m.teks_penutup || 'Terima kasih atas doa dan kehadiran Anda.';
  const formEmbed = /^https:\/\/docs\.google\.com\/forms\//.test(CFG.FORM_EMBED || '') ? CFG.FORM_EMBED : '';
  const peta = mapSrc(m);
  const linkMaps = /^https?:\/\//.test(m.link_alamat || '') ? m.link_alamat : '';

/* ===================== NAVIGASI MENU ===================== */
const menu = $('menu');
function go(name) {
  document.querySelectorAll('.panel').forEach(p => {
    const on = p.dataset.panel === name;
    p.classList.toggle('active', on);
    if (on) {
      p.scrollTop = 0;
      // iframe baru dimuat saat panelnya pertama dibuka (hemat kuota)
      p.querySelectorAll('iframe[data-src]').forEach(f => { f.src = f.dataset.src; f.removeAttribute('data-src'); });
    }
  });
  menu.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.go === name));
  $('app').dataset.panel = name;
  runSlides();
  requestAnimationFrame(scrub);
}

/* ===================== SLIDESHOW HOME ===================== */
const SLIDE_MS = 3800;           // jeda ganti foto (milidetik)
let slideTimer = null;
function nextSlide() {
  const list = [...document.querySelectorAll('#slides .slide')];
  if (list.length < 2) return;
  const i = list.findIndex(s => s.classList.contains('on'));
  const cur = list[i], nxt = list[(i + 1) % list.length];
  list.forEach(s => s.classList.remove('prev'));
  cur.classList.remove('on'); cur.classList.add('prev');
  nxt.classList.add('on');
  setTimeout(() => cur.classList.remove('prev'), 1400);
}
// Berjalan selama undangan terbuka dan tab aktif (hemat baterai); latar sama untuk semua halaman
function runSlides() {
  clearInterval(slideTimer); slideTimer = null;
  if (!menu.hidden && !document.hidden) slideTimer = setInterval(nextSlide, SLIDE_MS);
}
document.addEventListener('visibilitychange', runSlides);
menu.addEventListener('click', e => {
  const b = e.target.closest('button[data-go]');
  if (b) go(b.dataset.go);
});

/* ===================== HITUNG MUNDUR ===================== */
let cdTimer;
function startCountdown(target) {
  clearInterval(cdTimer);
  if (!target) return;
  const tick = () => {
    let s = Math.max(0, Math.floor((target - new Date()) / 1000));
    const d = Math.floor(s / 86400); s %= 86400;
    const h = Math.floor(s / 3600);  s %= 3600;
    const mi = Math.floor(s / 60);   s %= 60;
    $('cd-d').textContent = d; $('cd-h').textContent = h; $('cd-m').textContent = mi; $('cd-s').textContent = s;
  };
  tick(); cdTimer = setInterval(tick, 1000);
}

/* ===================== ANIMASI SCROLL & ZOOM FOTO ===================== */
let scrubImgs = [], io, ticking = false;
function initAnimations() {
  if (io) io.disconnect();
  io = new IntersectionObserver(entries => entries.forEach(e => e.target.classList.toggle('show', e.isIntersecting)), { threshold: 0.2 });
  document.querySelectorAll('[data-anim]').forEach(el => io.observe(el));
  scrubImgs = [...document.querySelectorAll('img[data-scrub]')];
  scrub();
}
function scrub() {
  const vh = innerHeight;
  scrubImgs.forEach(img => {
    const r = img.parentElement.getBoundingClientRect();
    if (r.width === 0 || r.bottom < 0 || r.top > vh) return;
    const p = Math.min(1, Math.max(0, (vh - r.top) / (vh + r.height)));
    const s = img.dataset.scrub === 'in' ? 1 + p * 0.25 : 1.25 - p * 0.25;
    img.style.transform = `scale(${s.toFixed(3)})`;
  });
  ticking = false;
}
// scroll terjadi di dalam panel (tidak menggelembung), jadi didengar lewat capture
addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(scrub); } }, { passive: true, capture: true });
addEventListener('resize', scrub);

/* ===================== BUKA / TUTUP & MUSIK ===================== */
const cover = $('cover'), openBtn = $('openBtn'), closeBtn = $('closeBtn'), musicBtn = $('musicBtn'), bgm = $('bgm');

openBtn.addEventListener('click', () => {
  if (openBtn.dataset.reload) return location.reload();
  cover.classList.add('open');
  document.body.classList.remove('locked');
  menu.hidden = false;
  go('home');
  if (bgm.getAttribute('src')) {
    musicBtn.hidden = false;
    bgm.play().then(() => musicBtn.classList.add('playing')).catch(() => {});
  }
  setTimeout(() => cover.classList.add('gone'), 1500);
});
closeBtn.addEventListener('click', () => {
  cover.classList.remove('gone');
  requestAnimationFrame(() => cover.classList.remove('open'));
  document.body.classList.add('locked');
  menu.hidden = true;
  musicBtn.hidden = true;
  bgm.pause(); musicBtn.classList.remove('playing');
  go('home');
});
musicBtn.addEventListener('click', () => {
  if (bgm.paused) { bgm.play(); musicBtn.classList.add('playing'); }
  else { bgm.pause(); musicBtn.classList.remove('playing'); }
});
